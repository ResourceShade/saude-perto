# Publica o Saúde Perto no GitHub Pages a cada push na branch main.
#
# O build roda aqui, não na máquina de quem faz o push: por isso a pasta dist/
# continua fora do versionamento (ver .gitignore).
#
# Antes do primeiro uso, ligue o Pages no repositório:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite disparar manualmente pela aba Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma que já esteja em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Verificar e construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        # VITE_BASE precisa casar com o nome do repositório, porque o Pages
        # publica em https://<usuario>.github.io/<repositorio>/.
        # github.event.repository.name resolve isso sozinho.
        run: VITE_BASE="/${{ github.event.repository.name }}/" npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
